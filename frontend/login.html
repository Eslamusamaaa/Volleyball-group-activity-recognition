<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — VolleyAI</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <style>
    body { display: grid; place-items: center; min-height: 100vh; padding: 24px; }
    .card { max-width: 420px; text-align: center; display: grid; gap: 18px; justify-items: center; }
    h1 { font-size: 36px; margin: 0; } h1 b { color: #ff8a45; }
    p { margin: 0; color: var(--muted, #9aa3b2); }
    #msg { min-height: 1.4em; font-size: 14px; }
    a { color: #ff8a45; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Volley<b>AI</b></h1>
    <p>Sign in with your Google account to enter. Your email address is recorded when you sign in.</p>
    <div id="btn"></div>
    <p id="msg" role="alert"></p>
    <p style="font-size:13px"><a href="/privacy.html">Privacy policy</a></p>
  </div>
  <script src="/config.js"></script>
  <script>
    const msg = (t) => { document.getElementById("msg").textContent = t || ""; };
    async function onCredential(r) {
      msg("Signing you in…");
      try {
        const res = await fetch("/__login", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ credential: r.credential }) });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) return msg(body.detail || "Sign-in failed.");
        try { localStorage.setItem("volleyai.idtoken", r.credential); } catch (e) { /* storage blocked */ }
        location.reload();
      } catch (e) { msg("Could not reach the server. Try again."); }
    }
    const s = document.createElement("script");
    s.src = "https://accounts.google.com/gsi/client"; s.async = true; s.defer = true;
    s.onload = () => {
      google.accounts.id.initialize({ client_id: window.GOOGLE_CLIENT_ID, callback: onCredential });
      google.accounts.id.renderButton(document.getElementById("btn"), { theme: "filled_black", size: "large", shape: "pill" });
    };
    s.onerror = () => msg("Google sign-in could not be loaded. Check your connection and reload.");
    document.head.appendChild(s);
  </script>
</body>
</html>

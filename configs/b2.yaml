# B2 (paper name: "Person Classification"): per-PLAYER crops, feature
# extracted with a FROZEN, never-fine-tuned ImageNet ResNet50 (no training of
# the backbone at all, no person-action fine-tuning), max-pooled across all
# players in the clip, then a small classifier head trained on the pooled
# feature -> 8-way scene class.
# Paper target: 64.6% test accuracy.
#
# NOTE: an earlier version of this config incorrectly used the whole scene
# image with a frozen backbone -- that is not this paper's B2 (no person-level
# input at all). Fixed to use src/training/train_pooled_person.py.
script: src.training.train_pooled_person
args:
  backbone-mode: frozen
  epochs: 15
  batch-size: 16
  workers: 4
  name: person_pooled_b2
command: >
  .venv\Scripts\python.exe -m src.training.train_pooled_person
  --backbone-mode frozen --epochs 15 --batch-size 16 --workers 4
  --name person_pooled_b2
checkpoint: outputs/checkpoints/person_pooled_b2.pt
results: outputs/results/person_pooled_b2.json
status: done
test_acc: 0.4218
note: >
  Below paper's 64.6% target (classifier head not fully converged at 15
  epochs on never-fine-tuned features); kept as-is since B2's role is an
  ablation comparison point, not a result to optimize. See outputs/results/RESULTS.md.

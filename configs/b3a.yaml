# B3-A: fine-tuned ResNet50 on individual PLAYER CROPS (not the whole image)
# -> 9-way per-player action class (standing, spiking, blocking, ...).
# This backbone is reused later (Phase B feature caching) for B5, B6, B7, B8.
script: src.training.train_backbone
args:
  task: person
  mode: finetune
  epochs: 15
  batch-size: 24
  workers: 4
  name: person_finetune_b3a
command: >
  .venv\Scripts\python.exe -m src.training.train_backbone
  --task person --mode finetune --epochs 15 --batch-size 24 --workers 4
  --name person_finetune_b3a
checkpoint: outputs/checkpoints/person_finetune_b3a.pt
results: outputs/results/person_finetune_b3a.json
status: done
test_acc: 0.8056
note: >
  Also ran a v2 (--loss focal --gamma 2.0 --sampler balanced) to address
  class imbalance: test_acc 0.7283, worse overall and worse on jumping
  specifically (recall 0.079 vs 0.191), though better on waiting/moving.
  v1 (this checkpoint) was selected to feed B2/B3/B5/B6/B7/B8 -- see
  outputs/results/RESULTS.md "B3-A -- detail" for the full comparison.
v2_checkpoint: outputs/checkpoints/person_finetune_b3a_v2.pt
v2_results: outputs/results/person_finetune_b3a_v2.json

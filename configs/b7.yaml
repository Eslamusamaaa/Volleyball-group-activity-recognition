# B7: full two-stage hierarchical model. LSTM1 (per-player, over 9 frames)
# -> max-pool all 12 players per frame -> LSTM2 (scene-level, over the
# resulting 9-step sequence) -> 8-way scene class.
# Paper target: 80.2% test accuracy.
cache_command: >
  .venv\Scripts\python.exe -m src.training.cache_features
  --level person --checkpoint outputs/checkpoints/person_finetune_b3a.pt
  --name b3a_person
script: src.training.train_temporal
args:
  variant: b7
  feature-name: b3a_person
  epochs: 30
  batch-size: 16
  name: b7
command: >
  .venv\Scripts\python.exe -m src.training.train_temporal
  --variant b7 --feature-name b3a_person --epochs 30 --batch-size 16 --name b7
checkpoint: outputs/checkpoints/b7.pt
results: outputs/results/b7.json
status: not_started
